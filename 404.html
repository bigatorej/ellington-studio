<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here. Ellington Studio</title>
<style>
:root{--ink:#14161a;--ink2:#3d434c;--mute:#6b7280;--line:#e2e4e8;--paper:#ffffff;--acc:#0b3d5c;--acc2:#b8860b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.55}
a{color:var(--acc);text-decoration:none}
header{border-bottom:1px solid var(--line)}
.nav{max-width:1080px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center}
.wordmark{font-weight:700;letter-spacing:.02em;font-size:18px;color:var(--ink)}
.wordmark span{color:var(--acc2)}
main{max-width:1080px;margin:0 auto;padding:96px 24px}
h1{font-size:44px;line-height:1.05;margin:0 0 20px;letter-spacing:-.02em}
p{font-size:20px;color:var(--ink2);margin:0 0 30px}
.cta{display:inline-block;background:var(--acc);color:#fff;padding:15px 26px;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<header><div class="nav"><a class="wordmark" href="/">ELLINGTON <span>STUDIO</span></a></div></header>
<main>
  <h1>That page is not here.</h1>
  <p>The address may have changed. Everything the Studio offers is on the home page.</p>
  <a class="cta" href="/">Go to the home page</a>
</main>
</body>
</html>
