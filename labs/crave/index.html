<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crave. Say what you are craving. Eat what fits.</title>
<meta name="description" content="Crave reads the calories you burned from your health app, works out what fits your body today, turns a craving into three foods that fit, and finds the meals at the restaurant you are in that fit your diet.">
<meta name="theme-color" content="#FFF7EC">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Crave">
<meta property="og:title" content="Crave. Say what you are craving. Eat what fits.">
<meta property="og:description" content="A Labs app from Ellington Enterprises. Health connected calorie budget, craving swaps, and restaurant meals that fit your diet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='64' height='64' fill='white'/%3E%3Ccircle cx='50' cy='16' r='13' fill='black'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='%23F26B1D' mask='url(%23m)'/%3E%3Ccircle cx='55' cy='27' r='2.2' fill='%231C1714'/%3E%3Ccircle cx='47' cy='8' r='1.8' fill='%231C1714'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tang:#F26B1D;--char:#1C1714;--cream:#FFF7EC;--white:#FFFFFF;--oat:#EDE2D2;--cocoa:#4A3B32;--clove:#8A7A6E;
  --basil:#2F7D4F;--lemon:#E3B23C;--berry:#B5365F;--sky:#3A7CA5;
  --basil-soft:#E3F1E8;--lemon-soft:#FBF1D9;--berry-soft:#F6E1E8;--sky-soft:#E1EEF5;--tang-soft:#FDE6D6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --r:16px;--r-sm:12px;--shadow:0 6px 24px rgba(28,23,20,.08),0 1px 2px rgba(28,23,20,.06);
  --tab-h:70px;--top-h:60px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--sky)}
h1,h2,h3,h4{font-family:var(--display);color:var(--char);margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;line-height:1.2}
h3{font-size:17px;line-height:1.25}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* shell */
.backdrop{min-height:100%;display:flex;justify-content:center;align-items:stretch;background:var(--cream)}
@media(min-width:720px){
  .backdrop{background:radial-gradient(1200px 600px at 20% 0%,#FDE6D6 0%,var(--cream) 55%),var(--cream);padding:28px 0}
  .shell{max-width:430px;width:100%;height:calc(100vh - 56px);min-height:720px;max-height:932px;border-radius:40px;box-shadow:0 30px 80px rgba(28,23,20,.18),0 0 0 10px #1C1714,0 0 0 12px #3b322d;overflow:hidden;position:relative}
}
.shell{width:100%;background:var(--cream);display:flex;flex-direction:column;position:relative;min-height:100vh}
@media(min-width:720px){.shell{min-height:0}}
.top{height:var(--top-h);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(255,247,236,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--oat)}
.brand{display:flex;align-items:center;gap:10px}
.brand .name{font-family:var(--display);font-weight:700;font-size:22px;color:var(--char);letter-spacing:-.02em}
.top .ctx{font-size:13px;font-weight:600;color:var(--sky);background:var(--sky-soft);padding:7px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.top .ctx.off{color:var(--clove);background:var(--oat)}
main{flex:1;overflow-y:auto;padding:16px 16px calc(var(--tab-h) + 24px);scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){main{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tab-h);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--oat);display:flex;justify-content:space-around;align-items:stretch;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--clove);border-radius:12px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--char)}
.tabs button.on svg{stroke:var(--tang)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* cards */
.card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{box-shadow:none;border:1px solid var(--oat)}
.card h3{margin-bottom:6px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--clove);margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--clove);font-size:13.5px}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--oat);color:var(--cocoa)}
.chip.pg{background:var(--tang-soft);color:#8f3b0b}
.chip.basil{background:var(--basil-soft);color:var(--basil)}
.chip.lemon{background:var(--lemon-soft);color:#8a6410}
.chip.berry{background:var(--berry-soft);color:var(--berry)}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.tog{border:1.5px solid var(--oat);background:var(--white);cursor:pointer}
.chip.tog.on{background:var(--char);color:var(--cream);border-color:var(--char)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;background:var(--tang);color:var(--char);transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.03)}
.btn.block{width:100%}
.btn.dark{background:var(--char);color:var(--cream)}
.btn.sky{background:var(--sky);color:#fff}
.btn.ghost{background:var(--white);border:1.5px solid var(--oat);color:var(--char)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.tiny{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{background:var(--berry-soft);color:var(--berry)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--char)}
.field input,.field select,.field textarea{border:1.5px solid var(--oat);background:var(--white);border-radius:12px;padding:11px 12px;font-size:15px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--clove)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sep{height:1px;background:var(--oat);margin:12px 0}
/* ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.ring{position:relative;width:220px;height:220px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c .n{font-family:var(--display);font-weight:700;font-size:50px;color:var(--char);line-height:1;letter-spacing:-.03em}
.ring .c .n.over{color:var(--berry)}
.ring .c .l{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--clove);font-weight:600;margin-top:4px}
.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:13px;color:var(--cocoa)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.macros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.macro .t{display:flex;flex-direction:column;gap:1px;font-size:12.5px;font-weight:600;color:var(--char);margin-bottom:6px}
.macro .t span:last-child{color:var(--clove);font-weight:500;font-size:12px}
.bar{height:8px;border-radius:999px;background:var(--oat);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
.bar.basil i{background:var(--basil)}.bar.lemon i{background:var(--lemon)}.bar.berry i{background:var(--berry)}.bar.tang i{background:var(--tang)}.bar.sky i{background:var(--sky)}
/* health */
.health{background:linear-gradient(135deg,#0f2f45 0%,#1f5a7a 100%);color:#e8f2f8;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.health h3{color:#fff}
.health .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 10px}
.health .stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;color:#fff;line-height:1.1}
.health .stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a9c7d9;font-weight:600}
.health .chip.pg{background:rgba(255,255,255,.14);color:#fff}
.health .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
/* food rows */
.food{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--oat)}
.food:first-of-type{border-top:0}
.food .ic{width:44px;height:44px;border-radius:12px;background:var(--tang-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--display);font-weight:700;color:#8f3b0b;font-size:17px;overflow:hidden}
.food .ic img{width:100%;height:100%;object-fit:cover}
.food .b{flex:1;min-width:0}
.food .b .n{font-weight:600;color:var(--char);font-size:15px}
.food .b .s{font-size:12.5px;color:var(--clove);margin-top:1px}
.food .b .m{display:flex;gap:10px;font-size:12.5px;margin-top:5px;color:var(--cocoa);flex-wrap:wrap}
.food .b .m b{color:var(--char)}
.food .b .why{font-size:13px;color:var(--cocoa);margin-top:6px;background:var(--cream);padding:7px 9px;border-radius:9px;line-height:1.35}
.food .k{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.food .k .kc{font-family:var(--display);font-weight:700;font-size:19px;color:var(--char);line-height:1}
.food .k .kc small{font-family:var(--body);font-size:11px;color:var(--clove);font-weight:600;margin-left:2px}
.match{height:6px;border-radius:999px;background:var(--oat);overflow:hidden;margin-top:6px;width:120px}
.match i{display:block;height:100%;background:var(--tang)}
.group-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.group-h h3{font-size:16px}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;border:1.5px solid var(--oat);background:var(--white);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--char)}
.pill.on{background:var(--char);color:var(--cream);border-color:var(--char)}
.rest{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--oat);width:100%;text-align:left}
.rest:first-child{border-top:0}
.rest .logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
.rest .n{font-weight:600;color:var(--char)}
.rest .d{font-size:12.5px;color:var(--clove)}
.rest .fit{margin-left:auto;text-align:right;font-size:12.5px;color:var(--basil);font-weight:600}
.search{display:flex;gap:8px;align-items:center;background:var(--white);border:1.5px solid var(--oat);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.search input{border:0;flex:1;font-size:15px;background:transparent;min-width:0}
.search input:focus{outline:none}
.search button{color:var(--clove);display:flex}
.search button.rec{color:var(--tang)}
.search button.rec.live{color:var(--berry);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.ex{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.ex button{text-align:left;font-size:14px;color:var(--sky);padding:6px 0;border-bottom:1px dashed var(--oat)}
.toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + 16px);transform:translateX(-50%) translateY(20px);background:var(--char);color:var(--cream);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:20;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:absolute;inset:0;background:rgba(28,23,20,.45);z-index:30;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--cream);width:100%;max-height:86%;overflow-y:auto;border-radius:24px 24px 0 0;padding:14px 18px 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .handle{width:40px;height:5px;border-radius:999px;background:var(--oat);margin:0 auto 14px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px}
.meal-h h3{font-size:15px;color:var(--clove);font-family:var(--body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.meal-h span{font-size:13px;color:var(--clove)}
.rm{color:var(--clove);font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--cream)}
.rm:hover{color:var(--berry)}
.daystrip{display:flex;justify-content:space-between;gap:6px;margin-bottom:14px}
.daystrip button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1.5px solid transparent}
.daystrip button.on{border-color:var(--char);background:var(--white)}
.daystrip .mini{width:34px;height:34px}
.daystrip .mini svg{transform:rotate(-90deg);width:100%;height:100%}
.daystrip span{font-size:11px;font-weight:600;color:var(--clove)}
.daystrip button.on span{color:var(--char)}
.opt{display:flex;flex-direction:column;gap:4px;padding:12px;border:1.5px solid var(--oat);border-radius:14px;background:var(--white);text-align:left;width:100%}
.opt.on{border-color:var(--char);box-shadow:0 0 0 1px var(--char)}
.opt b{color:var(--char);font-size:15px}
.opt span{font-size:12.5px;color:var(--clove);line-height:1.35}
.seg{display:flex;background:var(--oat);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--clove)}
.seg button.on{background:var(--white);color:var(--char);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--white);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:26px;font-weight:700;color:var(--char);line-height:1.1}
.tile span{font-size:12px;color:var(--clove);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chart{width:100%;height:auto;display:block}
.recipe h4{font-size:15px;margin:12px 0 6px;color:var(--char)}
.recipe ul,.recipe ol{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
.recipe li{margin-bottom:4px}
.term{padding:10px 0;border-top:1px solid var(--oat)}
.term:first-child{border-top:0}
.term b{color:var(--char);display:block;font-size:14px}
.term span{font-size:13.5px;color:var(--cocoa)}
.term em{display:block;font-size:12.5px;color:var(--clove);font-style:normal;margin-top:2px}
.foot{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--clove);font-size:12.5px;margin:24px 0 10px}
.inline-conf{display:flex;gap:8px;align-items:center;margin-top:8px}
.note{font-size:12.5px;color:var(--clove);background:var(--cream);border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.4}
.empty{text-align:center;color:var(--clove);padding:22px 10px;font-size:14px}
.rangerow{display:flex;align-items:center;gap:10px}
.rangerow input[type=range]{flex:1;accent-color:var(--tang)}
.rangerow output{font-weight:600;color:var(--char);min-width:64px;text-align:right;font-size:14px}
.badge-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.kbd{font-size:12px;color:var(--clove)}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;background:var(--oat);transition:background .2s;flex-shrink:0}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:var(--sky)}
.toggle.on i{left:21px}
.tut summary{cursor:pointer;font-weight:600;color:var(--char);padding:8px 0}
</style>
</head>
<body>
<div class="backdrop">
<div class="shell" id="shell">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" role="img" aria-label="Crave mark"><defs><mask id="bite"><rect width="64" height="64" fill="#fff"/><circle cx="50" cy="16" r="13" fill="#000"/></mask></defs><circle cx="32" cy="32" r="28" fill="#F26B1D" mask="url(#bite)"/><circle cx="55" cy="27" r="2.2" fill="#1C1714"/><circle cx="47" cy="8" r="1.8" fill="#1C1714"/></svg>
      <span class="name">Crave</span>
    </div>
    <button class="ctx" id="healthCtx" aria-label="Health connection status"></button>
  </header>
  <main id="main">
    <section class="view" id="v-today" aria-labelledby="t-today"></section>
    <section class="view" id="v-crave" aria-labelledby="t-crave"></section>
    <section class="view" id="v-out" aria-labelledby="t-out"></section>
    <section class="view" id="v-log" aria-labelledby="t-log"></section>
    <section class="view" id="v-me" aria-labelledby="t-me"></section>
  </main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
    <button data-tab="crave"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Crave</button>
    <button data-tab="out"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.5 6-11a6 6 0 0 0-12 0c0 5.5 6 11 6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Out</button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Log</button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>
</div>
<script>
/* ---------- DATA ----------
   Nutrition is per serving, rounded, from USDA FoodData Central standard servings and
   published restaurant nutrition pages. Restaurant items are approximate and say so in the UI.
   Flavor profile order: crunchy, salty, sweet, creamy, savory, spicy, fresh, warm (0 to 5 each).
   Tags: veg (vegetarian), vegan, pesc (pescatarian), keto, lowcarb, med (Mediterranean), hp (high protein), glp1 (protein first, small portion).

// Basal metabolic rate, Mifflin St Jeor. Plain words: the calories you burn lying still all day.
function bmr(p){ const kg = p.weight*0.4536, cm = p.heightIn*2.54; return p.sex==="m" ? 10*kg+6.25*cm-5*p.age+5 : 10*kg+6.25*cm-5*p.age-161; }
// Simulated HealthKit: steps accumulate on a day curve from about 6 am to 10 pm.
function dayFraction(){ const n=new Date(); return (n.getHours()*60+n.getMinutes())/1440; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function healthToday(){
  const h = S.health; if(!h.on) return null;
  const frac = smooth((dayFraction()-0.25)/(0.92-0.25));

  const wk = (h.workouts[todayStr()]||[]);
  const wkKcal = wk.reduce((a,w)=>a+w.kcal,0);

}
function macroSplit(p){
  let [pp,cc,ff] = BODY.find(b=>b.id===p.body).split;
  if(p.diet==="hp"){ pp+=10; cc-=10; }
  if(p.diet==="lowcarb"){ const cut=Math.max(0,cc-20); cc=Math.min(cc,20); pp+=Math.round(cut/2); ff+=cut-Math.round(cut/2); }
  if(p.diet==="keto"){ const cut=Math.max(0,cc-10); cc=Math.min(cc,10); pp=Math.min(pp+5,30); ff=100-pp-cc; }
  return [pp,cc,ff];
}
// The budget for today: resting + active, less the deficit, with a floor.
function budget(){
  const p = S.profile, h = healthToday();
  const deficit = p.rate===1?500:250;
  let resting, active, mode;
  if(h){ resting=h.resting; active=h.active; mode="health"; }
  else { resting=Math.round(bmr(p)*p.activity); active=0; mode="activity"; }
  let kcal = resting+active-deficit; const floor = p.sex==="m"?1500:1200; let floored=false;
  if(kcal<floor){ kcal=floor; floored=true; }
  const [pp,cc,ff] = macroSplit(p);
  let pG = Math.round(kcal*pp/100/4), cG = Math.round(kcal*cc/100/4), fG = Math.round(kcal*ff/100/9);
  if(p.diet==="glp1"){ const fl = Math.round(1.2*p.goal*0.4536); if(pG<fl){ const extra=fl-pG; pG=fl; cG=Math.max(40, cG-extra); } }

  return { kcal, pG, cG, fG, resting, active, deficit, mode, floored, floor, eaten, left:kcal-eaten.kcal, leftP:pG-eaten.p, leftC:cG-eaten.c, leftF:fG-eaten.f, fiberT:p.sex==="m"?30:25 };
}
function dietAllows(tags, diet){
  switch(diet){
    case "veg": return tags.includes("veg")||tags.includes("vegan");
    case "vegan": return tags.includes("vegan");
    case "pesc": return tags.includes("pesc")||tags.includes("veg")||tags.includes("vegan");
    case "keto": return tags.includes("keto");
    case "lowcarb": return tags.includes("lowcarb")||tags.includes("keto");
    default: return true;

}
function blocked(food){
  const p=S.profile; const name=food.name.toLowerCase();
  if(!dietAllows(food.tags,p.diet)) return "diet";

  if(food.id && p.allergies.some(a=>(FOOD_ALLERGENS[a]||[]).includes(food.id))) return "allergy";
  if(!food.id && p.allergies.length && /cheese|yogurt|milk|alfredo|parm|feta|gruyere|cheddar|latte|macchiato|muffin|cookie/i.test(name) && p.allergies.includes("dairy")) return "allergy";

  if(!food.id && p.allergies.includes("tree nuts") && /walnut|almond/i.test(name)) return "allergy";
  if(!food.id && p.allergies.includes("peanuts") && /peanut|pad thai/i.test(name)) return "allergy";

// How well a food fits what is left today, 0 to 100. Protein dense, fiber rich foods that fit the gap score highest.
function fitScore(food, B){
  let s = 60;
  const rem = Math.max(B.left, 0);
  if(rem<=0) s -= Math.min(60, food.kcal/5);
  else if(food.kcal>rem) s -= Math.min(60, (food.kcal-rem)/rem*80);
  else { const share = food.kcal/rem; if(share>0.6) s -= (share-0.6)*50; }

}
function namedTarget(text){
  const t=(text||"").toLowerCase(); let best=null;
  for(const [w,id] of FOOD_WORDS){ if(t.includes(w) && (!best || w.length>best.w.length)) best={w,id}; }
  return best ? FOODS.find(f=>f.id===best.id) : null;
}
function cravingVector(text, chips, target){
  const t = (text||"").toLowerCase(); const v = FLAVORS.map(()=>0); let hit=false;
  if(target){ const m=Math.max(...target.flavor,1); target.flavor.forEach((x,i)=>{ v[i]=x/m*5; }); hit=true; }
  FLAVORS.forEach((fl,i)=>{ FLAVOR_WORDS[fl].forEach(w=>{ if(t.includes(w)){ v[i]=Math.max(v[i],3)+1; hit=true; } }); if(chips.includes(fl)){ v[i]=5; hit=true; } });

function cosine(a,b){ let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){ d+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; } return (na&&nb)?d/Math.sqrt(na*nb):0; }

function flavorMatch(v, food){ let asked=0, got=0; for(let i=0;i<v.length;i++){ if(v[i]>0){ asked+=v[i]; got+=Math.min(v[i], food[i]); } } const cov = asked? got/asked : 0; return 0.5*cov + 0.5*cosine(v, food); }

  const named = namedTarget(text);

  const target = named || all[0].f;

  // Words shared with the craving or the target pull a food up: "pasta" for pasta, "pizza" for pizza.
  const words = new Set(`${(text||"")} ${named?named.name:""}`.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=4 && !["with","like","something","bowl","over","and","the"].includes(w)));

    .filter(o=>o.cos>=0.7 && (o.f.id===target.id ? o.fit>=80 : o.fit>=45)).sort((a,b)=>b.score-a.score);

function whyLine(o, target, v, B){

}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function recommendNow(){

function restaurantFits(rest){

function renderDayLog(day, remove){
  const log = S.log[day]||[]; if(!log.length) return `<div class="empty">Nothing logged yet. Add a food or ask Crave what fits.</div>`;
  const meals = ["Breakfast","Lunch","Dinner","Snack"]; return meals.filter(m=>log.some(e=>e.meal===m)).map(m=>{ const es=log.filter(e=>e.meal===m); const k=es.reduce((a,e)=>a+e.kcal,0); return `<div class="meal-h"><h3>${m}</h3><span>${fmtN(k)} kcal</span></div>${es.map(e=>foodRow(e,{log:false,remove,sub:e.mult!==1?`${e.mult}x`:""})).join("")}`; }).join("");
}

function viewLog(){

  const results = q.length>=2 ? [...FOODS.filter(f=>f.name.toLowerCase().includes(q)).map(f=>({f,src:"food",key:f.id})), ...RESTAURANTS.flatMap(r=>r.items.filter(i=>i.name.toLowerCase().includes(q)).map(i=>({f:i,src:"rest",key:i.name,rest:r.id,sub:r.name})))].slice(0,12) : [];

function mealNow(){ const h=new Date().getHours(); return h<10?"Breakfast":h<14?"Lunch":h<17?"Snack":h<21?"Dinner":"Snack"; }

  const ws=S.weights.slice(-30); const minW=Math.min(...ws.map(w=>w.w),p.goal)-2, maxW=Math.max(...ws.map(w=>w.w))+2; const W=360,Hh=150,padL=34,padB=22;

  const path = ws.map((w,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(w.w).toFixed(1)}`).join(" ");

    ${S._confirmReset?`<div class="inline-conf"><span class="small">Replace everything with the demo data?</span><button class="btn tiny danger" data-act="reset-yes">Yes, reset</button><button class="btn tiny ghost" data-act="reset-no">Keep</button></div>`:""}
  </div>
  <div class="card flat"><h3>How this playground works</h3><p class="small" style="margin-top:6px">Everything runs on this device. Nothing leaves the browser. The real app adds an account, sync across devices, HealthKit and Health Connect, a vision model for photos, web search for any restaurant, and Claude to read your cravings.</p></div>
  <div class="foot"><svg viewBox="0 0 512 512" width="20" height="20" role="img" aria-label="Ellington Enterprises"><rect x="42.67" y="42.67" width="42.67" height="426.67" fill="#0F2744"/><rect x="42.67" y="42.67" width="192" height="42.67" fill="#0F2744"/><rect x="42.67" y="234.67" width="192" height="42.67" fill="#B4471F"/><rect x="42.67" y="426.67" width="192" height="42.67" fill="#0F2744"/><rect x="426.67" y="42.67" width="42.67" height="426.67" fill="#0F2744"/><rect x="277.33" y="42.67" width="192" height="42.67" fill="#0F2744"/><rect x="277.33" y="234.67" width="192" height="42.67" fill="#B4471F"/><rect x="277.33" y="426.67" width="192" height="42.67" fill="#0F2744"/></svg><span>A Labs app from Ellington Enterprises LLC</span></div>`;
}

/* ---------- RENDER ---------- */
const VIEWS = {today:viewToday, crave:viewCrave, out:viewOut, log:viewLog, me:viewMe};
function render(){
  renderTop();
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="v-"+S.tab));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  const el = $("#v-"+S.tab); const focused = document.activeElement && document.activeElement.id; const pos = document.activeElement && document.activeElement.selectionStart;
  el.innerHTML = VIEWS[S.tab]();
  if(focused){ const f=document.getElementById(focused); if(f && f.tagName==="INPUT"){ f.focus(); try{ f.setSelectionRange(pos,pos);}catch(e){} } }
  save();
}
function go(tab){ S.tab=tab; $("#main").scrollTop=0; render(); }

/* ---------- ACTIONS ---------- */
function logFood(src, key, restId, mult){
  mult = mult || S._mult || 1; let f;
  if(src==="rest"){ const r=RESTAURANTS.find(x=>x.id===restId); f = r && r.items.find(i=>i.name===key); if(f) f={...f, name:`${f.name}`, serving:`${r.name}${f.serving?", "+f.serving:""}`, id:null}; }
  else { f = FOODS.find(x=>x.id===Number(key)); }
  if(!f) return;
  const day = S.tab==="log" ? (S.selectedDay||todayStr()) : todayStr();
  const e = {id:uid(), fid:f.id, name:f.name, serving:f.serving, kcal:f.kcal*mult, p:f.p*mult, c:f.c*mult, f:f.f*mult, fiber:f.fiber*mult, sugar:f.sugar*mult, meal:mealNow(), mult, src:src==="rest"?"Restaurant":"Foods", thumb:S.photoPending||null};
  (S.log[day] = S.log[day]||[]).push(e); S.photoPending=null; S._logQ="";
  const B = budget(); toast(`Logged ${f.name}. ${B.left>=0?fmtN(B.left)+" left today.":"Over by "+fmtN(-B.left)+"."}`); render();
}
function showRecipe(k){ const r=RECIPES[k]; const f=FOODS.find(x=>x.recipe===k); openSheet(`<div class="recipe"><div class="eyebrow">Super recipe</div><h2>${esc(r.name)}</h2><p class="muted" style="margin:4px 0 10px">${esc(r.serves)} · ${esc(r.macros)}</p><p class="note" style="margin:0 0 6px"><b>The flavor it keeps.</b> ${esc(r.keeps)}</p><h4>Ingredients</h4><ul>${r.ing.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h4>Method</h4><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="sep"></div><div class="row"><button class="btn" data-act="log" data-src="food" data-id="${f.id}" data-close="1">Log it, ${fmtN(f.kcal)} kcal</button><button class="btn ghost" data-act="close">Close</button></div></div>`); }
function download(name, text, type="application/json"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act],[data-tab]"); if(!t) return;
  if(t.dataset.tab && !t.dataset.act){ go(t.dataset.tab); return; }
  const a = t.dataset.act, d = t.dataset;
  switch(a){
    case "goto": go(d.tab); break;
    case "log": logFood(d.src, d.id, d.rest); if(d.close) closeSheet(); break;
    case "recipe": showRecipe(d.r); break;
    case "close": closeSheet(); break;
    case "remove": { const day=S.tab==="log"?(S.selectedDay||todayStr()):todayStr(); S.log[day]=(S.log[day]||[]).filter(x=>x.id!==d.id); toast("Removed"); render(); break; }
    case "workout": { const k={run:["30 minute run",300],walk:["30 minute walk",120],lift:["Strength session",200]}[d.k]; const day=todayStr(); (S.health.workouts[day]=S.health.workouts[day]||[]).push({name:k[0],kcal:k[1],t:new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}); toast(`${k[0]} added. ${k[1]} more to eat today.`); render(); break; }
    case "health-on": S.health.on=true; toast("Health connected"); render(); break;
    case "health-toggle": S.health.on=!S.health.on; toast(S.health.on?"Health connected":"Health off. Using your activity level."); render(); break;
    case "recs": S._recs=true; render(); break;
    case "chip": { const i=S.cravingChips.indexOf(d.f); if(i>=0) S.cravingChips.splice(i,1); else S.cravingChips.push(d.f); render(); break; }
    case "ex": S.craveText=d.x; S.cravingChips=[]; doSwap(); break;
    case "swap": S.craveText=$("#craveIn").value; doSwap(); break;
    case "near": S._near=true; render(); break;
    case "rest": S.outRest=d.id; S._menuQ=""; $("#main").scrollTop=0; render(); break;
    case "rest-back": S.outRest=null; render(); break;
    case "diet": S.profile.diet=d.d; toast(`Diet set to ${DIETS.find(x=>x.id===d.d).name}`); render(); break;
    case "body": S.profile.body=d.b; render(); break;
    case "allergy": { const i=S.profile.allergies.indexOf(d.a); if(i>=0) S.profile.allergies.splice(i,1); else S.profile.allergies.push(d.a); render(); break; }
    case "day": S.selectedDay=d.d; render(); break;
    case "mult": S._mult=Number(d.m); render(); break;
    case "photo": $("#photoIn").click(); break;
    case "photo-clear": S.photoPending=null; render(); break;
    case "weigh": openSheet(`<h2>Log weight</h2><p class="muted" style="margin:4px 0 12px">${fmtDate(new Date())}</p><div class="field"><label>Weight, lb</label><input type="number" id="wIn" step="0.1" value="${S.profile.weight}"></div><div class="row"><button class="btn" data-act="weigh-save">Save</button><button class="btn ghost" data-act="close">Cancel</button></div>`); setTimeout(()=>$("#wIn").focus(),50); break;
    case "weigh-save": { const w=Number($("#wIn").value); if(!w) return; const t=todayStr(); const ex=S.weights.find(x=>x.d===t); if(ex) ex.w=w; else S.weights.push({d:t,w}); S.weights.sort((a,b)=>a.d<b.d?-1:1); S.profile.weight=w; closeSheet(); toast(`Weight ${w} lb saved`); render(); break; }
    case "export": download(`crave-${todayStr()}.json`, JSON.stringify(S,null,2)); toast("Exported"); break;
    case "reset": S._confirmReset=true; render(); break;
    case "reset-no": S._confirmReset=false; render(); break;
    case "reset-yes": S=seed(); S.tab="me"; save(); toast("Back to the demo data"); render(); break;
  }
});
function doSwap(){ S._swapTried=true; const r = swap(S.craveText, S.cravingChips); S._swap = r; render(); if(r) setTimeout(()=>{ const g=document.querySelector("#v-crave .group-h"); if(g) g.scrollIntoView({behavior:"smooth",block:"start"}); },50); }

document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="craveIn"){ S.craveText=t.value; return; }
  if(t.id==="outIn"){ S._outQ=t.value; render(); return; }
  if(t.id==="menuIn"){ S._menuQ=t.value; render(); return; }
  if(t.id==="logIn"){ S._logQ=t.value; render(); return; }
  if(t.dataset.act==="steps"){ S.health.steps=Number(t.value); t.nextElementSibling.textContent=fmtN(S.health.steps); save(); renderTop(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target; const p=S.profile;
  if(t.dataset.prof){
    const k=t.dataset.prof, v=t.value;
    if(k==="ft"||k==="in"){ const ft=Number(document.querySelector('[data-prof="ft"]').value)||5, inch=Number(document.querySelector('[data-prof="in"]').value)||0; p.heightIn=ft*12+inch; }
    else if(k==="dislikes"){ p.dislikes=v.split(",").map(s=>s.trim()).filter(Boolean); }
    else if(k==="sex"){ p.sex=v; }
    else { p[k]=Number(v); }
    if(k==="weight"){ const t0=todayStr(); const ex=S.weights.find(x=>x.d===t0); if(ex) ex.w=p.weight; else S.weights.push({d:t0,w:p.weight}); }
    toast("Saved"); render(); return;
  }
  if(t.id==="craveIn"){ S.craveText=t.value; doSwap(); return; }
  if(t.id==="photoIn" && t.files[0]){ const file=t.files[0]; const img=new Image(); img.onload=()=>{ const max=600; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); S.photoPending=c.toDataURL("image/jpeg",.8); URL.revokeObjectURL(img.src); t.value=""; toast("Photo ready. Pick the closest food."); render(); setTimeout(()=>{ const i=$("#logIn"); if(i) i.focus(); },50); }; img.src=URL.createObjectURL(file); return; }
  if(t.id==="importIn" && t.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&d.profile&&d.log){ S=d; save(); toast("Imported"); render(); } else toast("That file is not a Crave export."); }catch(e){ toast("Could not read that file."); } }; r.readAsText(t.files[0]); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="craveIn"){ S.craveText=e.target.value; doSwap(); } if(e.key==="Escape") closeSheet(); });

/* Speech: real in Chrome and Safari, typed fallback elsewhere. */
document.addEventListener("click", e=>{
  const m=e.target.closest("#craveMic"); if(!m) return;
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("No microphone here. Type instead."); $("#craveIn").focus(); return; }
  const rec=new SR(); rec.lang="en-US"; rec.interimResults=true; m.classList.add("live");
  rec.onresult = ev=>{ const txt=[...ev.results].map(r=>r[0].transcript).join(" "); $("#craveIn").value=txt; S.craveText=txt; };
  rec.onend = ()=>{ m.classList.remove("live"); if(S.craveText) doSwap(); };
  rec.onerror = ()=>{ m.classList.remove("live"); toast("Could not hear that. Type instead."); };
  rec.start();
});

load(); render();
</script>
