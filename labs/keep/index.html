<style>
:root{
  --plum:#4A2545; --ink:#23161F; --cream:#FFF9F3; --white:#FFFFFF; --blush:#F6E3E0; --petal:#E8C9C4;
  --marigold:#E89B2E; --moss:#4C7A5A; --rose:#B23A48; --muted:#6B5A63; --soft:#F3E9E6;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --r-card:20px; --r-btn:14px; --shadow:0 1px 2px rgba(35,22,31,.04),0 6px 20px rgba(74,37,69,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{overflow-x:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:var(--plum)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:8px}
.backdrop{min-height:100%;display:flex;justify-content:center;align-items:stretch}
.shell{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--cream);overflow:hidden}
@media (min-width:768px){
  body{background:linear-gradient(165deg,#F2E6E3 0%,#EADADA 55%,#E3D1D6 100%);}
  .backdrop{align-items:center;padding:24px 16px}
  .shell{width:430px;max-width:100%;height:min(900px,calc(100vh - 48px));border-radius:44px;box-shadow:0 30px 80px rgba(74,37,69,.22),0 0 0 10px #2a1a26,0 0 0 12px #3c2a37}
}
.top{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--petal);background:var(--cream)}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-family:var(--serif);font-size:26px;color:var(--plum);letter-spacing:.2px;line-height:1}
.ctx{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;background:var(--blush);color:var(--plum);font-weight:600;font-size:14px}
.ctx svg{width:18px;height:18px}
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:18px 20px 28px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.view{min-height:100%}
.h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin:4px 0 6px;color:var(--plum)}
.h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2;margin:22px 0 10px;color:var(--plum)}
.h3{font-weight:600;font-size:15px;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.card{background:var(--white);border:1px solid var(--petal);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.group{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.group:first-of-type{margin-top:0}
.group .dot{width:10px;height:10px;border-radius:50%;background:var(--marigold);display:inline-block}
.item{width:100%;display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--petal);border-radius:var(--r-card);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--marigold)}
.item:active{transform:scale(.995)}
.item-body{flex:1;min-width:0}
.item-name{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-occ{color:var(--plum);font-size:14px;margin-top:1px}
.item-date{color:var(--muted);font-size:13px;margin-top:2px}
.item .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .side .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:18px;flex:0 0 44px;letter-spacing:.5px}
.avatar-lg{width:64px;height:64px;flex-basis:64px;font-size:26px}
.avatar-sm{width:30px;height:30px;flex-basis:30px;font-size:13px}
.avatars{display:inline-flex;flex:0 0 44px;position:relative;width:44px;height:44px}
.avatars .avatar-sm{position:absolute;border:2px solid #fff}
.avatars .avatar-sm:first-child{left:0;top:0}
.avatars .avatar-sm:last-child{right:0;bottom:0}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blush);color:var(--plum);white-space:nowrap}
.chip-write{background:var(--plum);color:#fff}
.chip-send{background:var(--marigold);color:var(--ink)}
.chip-coming{background:transparent;border:1px solid var(--petal);color:var(--muted)}
.chip-done{background:#E4EFE7;color:var(--moss)}
.chip-missed{background:#F8E4E6;color:var(--rose)}
.chip-snoozed{background:var(--soft);color:var(--muted)}
.chip-idea{background:var(--blush);color:var(--plum)}
.chip-bought{background:#FBEBD3;color:#7A4A05}
.chip-given{background:#E4EFE7;color:var(--moss)}
.pg{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--soft);color:var(--muted);border:1px solid var(--petal)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--r-btn);font-weight:600;font-size:15px;transition:transform .08s ease,background .15s ease;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--marigold);color:var(--ink)}
.btn-primary:hover{background:#DF9124}
.btn-secondary{background:var(--blush);color:var(--plum)}
.btn-secondary:hover{background:#F0D6D2}
.btn-ghost{background:transparent;color:var(--plum);border:1px solid var(--petal)}
.btn-danger{background:transparent;color:var(--rose);border:1px solid #E7BFC4}
.btn-sm{height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn-block{width:100%}
.btn-link{background:transparent;color:var(--plum);height:30px;padding:0 4px;border-radius:8px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1 1 auto}
.field{display:block;margin-bottom:12px}
.field span.lbl,label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;height:46px;border:1px solid var(--petal);border-radius:12px;background:#fff;padding:0 12px;font-size:16px;color:var(--ink)}
textarea.input{height:auto;min-height:150px;padding:12px;line-height:1.5;resize:vertical}
.input:focus-visible{outline:3px solid var(--plum);outline-offset:1px}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--plum)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{margin:0;padding:0;list-style:none}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--soft)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;font-size:15px}
.li .s{color:var(--muted);font-size:13.5px;margin-top:1px}
.li .s.plum{color:var(--plum)}
.slip{width:9px;height:9px;border-radius:50%;background:var(--rose);display:inline-block;margin-left:6px;vertical-align:middle}
.steps{margin:0;padding:0;list-style:none}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--soft);align-items:flex-start}
.step:first-child{border-top:0;padding-top:0}
.step:last-child{padding-bottom:0}
.step .mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--petal);display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;margin-top:1px;color:#fff;font-size:14px}
.step.done .mark{background:var(--moss);border-color:var(--moss)}
.step.skipped .mark{background:var(--soft);border-color:var(--petal);color:var(--muted)}
.step.now .mark{border-color:var(--marigold);background:var(--marigold);color:var(--ink)}
.step.missed .mark{border-color:var(--rose);color:var(--rose)}
.step .grow{flex:1;min-width:0}
.step .t{font-weight:600}
.step.done .t{color:var(--moss)}
.step .s{color:var(--muted);font-size:13.5px}
.step .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sheet-head-title{font-family:var(--serif);font-size:24px;color:var(--plum);margin:0;line-height:1.1}
.tones{display:flex;gap:8px;margin:0 0 10px}
.tone{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--petal);background:#fff;color:var(--plum);font-weight:600;font-size:14px}
.tone[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filters .tone{height:32px;font-size:13.5px}
.big{font-family:var(--serif);font-size:30px;color:var(--plum);line-height:1}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.money{font-weight:600;color:var(--ink);white-space:nowrap}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty .big{font-size:24px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--petal);background:var(--cream);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"] svg{stroke:var(--plum)}
.tab .badge{position:absolute}
.sheet-root{position:absolute;inset:0;z-index:30;display:none}
.sheet-root.open{display:block}
.sheet-backdrop{position:absolute;inset:0;background:rgba(35,22,31,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--cream);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(35,22,31,.2);animation:up .22s ease-out}
.sheet.tall{height:92%}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet-head{flex:0 0 auto;padding:10px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.handle{width:40px;height:5px;border-radius:3px;background:var(--petal);margin:8px auto 0}
.sheet-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 20px 28px}
.close{width:36px;height:36px;border-radius:50%;background:var(--blush);color:var(--plum);display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px}
.close svg{width:18px;height:18px}
.toasts{position:absolute;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:40}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(35,22,31,.25);animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.table-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;margin:24px 0 8px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.status{font-weight:600;color:var(--plum)}
.note-x{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px}
.note-x svg{width:14px;height:14px}
.mark-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{color:var(--muted);font-size:13.5px}
.inline-form{background:var(--soft);border-radius:14px;padding:12px;margin-top:10px}
.quiet{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

/* ---------- occasions and items ---------- */
/* An item is one dated occurrence inside the window from 7 days ago to 60 days out. */
function buildItems(){
  const t = today(), from = addDays(t, -7), items = [];
  const push = o => {
    o.days = daysBetween(t, o.date);
    if (o.days < -7 || o.days > 60) return;
    o.year = o.date.getFullYear();
    o.key = o.pid + ':' + o.occId + ':' + o.year;
    items.push(o);
  };
  S.people.forEach(p => {
    if (p.birthday) {
      const date = nextOccurrence(p.birthday.month, p.birthday.day, from);
      push({ kind:'birthday', pid:p.id, occId:'bday', people:[p], person:p, date, age: p.birthday.year ? date.getFullYear() - p.birthday.year : null });
    }
    if (p.anniversary) {
      const date = nextOccurrence(p.anniversary.month, p.anniversary.day, from);
      push({ kind:'anniversary', pid:p.id, occId:'anniv', people:[p], person:p, date, years: p.anniversary.year ? date.getFullYear() - p.anniversary.year : null });
    }
    p.occasions.forEach(o => {
      const date = o.repeats === 'once' ? new Date(o.year, o.month - 1, o.day) : nextOccurrence(o.month, o.day, from);
      push({ kind:'custom', pid:p.id, occId:o.id, people:[p], person:p, date, title:o.title, once: o.repeats === 'once' });
    });
  });
  S.holidays.forEach(h => {
    const people = h.personIds.map(byId).filter(Boolean);
    if (!people.length) return;
    push({ kind:'holiday', pid:'h:' + h.id, occId:h.id, people, person:people[0], date:new Date(h.year, h.month - 1, h.day), title:h.title, plan:h.plan, once:true });
  });
  const rank = { birthday:0, anniversary:1, holiday:2, custom:3 };
  items.sort((a, b) => (a.days - b.days) || (rank[a.kind] - rank[b.kind]) || a.person.name.localeCompare(b.person.name));
  return items;
}
function itemByKey(key){ return buildItems().find(i => i.key === key); }
function isSent(item){ return S.done[item.key + ':send'] === true; }
function upcoming(){ return buildItems().filter(i => i.days >= 0 && !isSent(i)); }
function missed(){ return buildItems().filter(i => i.days < 0 && !isSent(i)); }
function occLabel(item){

}

/* The ladder. Window = the step with the smallest lead that is still at or past today.
   Current = the first open step from the window on. Steps before the window that were
   never done are missed. Beyond the first lead the item is still coming up. */
function ladderFor(item){
  const d = item.days;
  const steps = STEPS.map(s => Object.assign({}, s, { lead: Number(S.leads[s.k]) || 0 }));
  let w = -1;
  steps.forEach((s, i) => { if (s.lead >= d) w = i; });
  const todayIso = iso(today());
  const out = steps.map((s, i) => {
    const key = item.key + ':' + s.k;
    const dv = S.done[key];
    let state;
    if (dv === 'skipped') state = 'skipped';
    else if (dv) state = 'done';
    else if (w < 0) state = 'upcoming';
    else if (i < w) state = 'missed';
    else state = 'open';
    const snoozedUntil = S.snoozed[key];
    const snoozed = !!snoozedUntil && snoozedUntil > todayIso;
    return Object.assign({}, s, { key, state, snoozed, firesIn: d - s.lead });
  });
  let current = null;
  if (w >= 0) { for (let i = w; i < out.length; i++) { if (out[i].state === 'open') { current = out[i]; break; } } }
  return { steps: out, window: w, current, complete: w >= 0 && !current };
}
function chipFor(item){
  const L = ladderFor(item);
  if (L.window < 0) return { cls:'chip-coming', text:'Coming up' };
  if (L.complete) return { cls:'chip-done', text:'Done' };
  if (L.current.snoozed) return { cls:'chip-snoozed', text:'Snoozed' };
  return { cls:'chip-' + L.current.k, text:L.current.label };
}
/* When a person is added inside the ladder, the steps that already passed are skipped. */
function skipPassedSteps(pid){
  buildItems().filter(i => i.pid === pid && i.days >= 0).forEach(item => {
    STEPS.forEach(s => {
      const lead = Number(S.leads[s.k]) || 0;
      const key = item.key + ':' + s.k;
      if (lead > item.days && !S.done[key]) S.done[key] = 'skipped';
    });
  });
}
function dueToday(){
  const todayIso = iso(today());
  return upcoming().map(item => {
    const L = ladderFor(item);
    if (!L.current || L.current.snoozed || L.current.lead < item.days) return null;
    return { item, step: L.current };
  }).filter(Boolean);
}

/* One specific line pulled from the newest note that matches a rule, else gift history. */
function specific(p, mode){
  const reason = mode === 'reason';
  const notes = newestNotes(p);
  for (const n of notes) {
    const t = n.text.trim();
    let m;
    if ((m = t.match(/^loves?\s+(.+?)\.?$/i))) {
      const items = m[1].split(/,\s*|\s+and\s+/).map(x => x.trim()).filter(Boolean);
      const last = items[items.length - 1];
      return reason ? Pron(p) + ' loves ' + m[1] + '. Send a photo or a link.' : 'Hope there is ' + last + ' involved.';
    }
    if ((m = t.match(/^kids?:\s*([A-Z][a-z]+)/i))) {
      return reason ? 'Ask how ' + m[1] + ' is doing.' : 'Tell ' + m[1] + ' I said hi.';
    }
    if ((m = t.match(/just started\s+(?:at|as)?\s*(.+?)\.?$/i))) {
      return reason ? Pron(p) + ' just started at ' + m[1].replace(/^at\s+/i, '') + '.' : 'How is it going at ' + m[1].replace(/^at\s+/i, '') + '?';
    }
    if ((m = t.match(/^starting\s+(?:as\s+)?(.+?)\s+at\s+(.+?)\.?$/i))) {
      return reason ? Pron(p) + ' is starting as ' + m[1] + ' at ' + m[2] + '. Ask how it feels.' : 'Good luck as ' + m[1] + ' at ' + m[2] + '.';
    }
    if ((m = t.match(/\b([A-Z][a-z]+)\s+started\s+(.+?)(\s+this\s+\w+)?\.?$/))) {
      return reason ? 'Ask how ' + m[1] + "'s " + m[2] + ' is going.' : 'How is ' + m[1] + "'s " + m[2] + ' going?';
    }
    if ((m = t.match(/moved to\s+([A-Z][\w ]*?)(?:\s+in\s+\w+)?\.?$/i))) {
      return reason ? Pron(p) + ' moved to ' + m[1] + '. Ask how it is going.' : 'How is ' + m[1] + ' treating you?';
    }
    if ((m = t.match(/training for\s+(?:the\s+)?(.+?)\.?$/i))) {
      return reason ? 'Ask about the ' + m[1] + ' training.' : 'How is the ' + m[1] + ' training going?';
    }
    if ((m = t.match(/(?:dog|cat|pup|puppy)\s+(?:is|named|called)\s+([A-Z][a-z]+)/i))) {
      return reason ? 'Ask about ' + m[1] + '.' : 'Give ' + m[1] + ' a scratch from me.';
    }
    if ((m = t.match(/back from\s+(.+?)\.?$/i))) {
      return reason ? 'Ask about ' + m[1] + '.' : 'I want to hear all about ' + m[1] + '.';
    }
    if ((m = t.match(/retiring\s+(.+?)\.?$/i))) {
      return reason ? 'Ask about the retirement plans.' : 'Retirement ' + m[1] + ' is going to suit you.';
    }
    if ((m = t.match(/engaged to\s+([A-Z][a-z]+)/i))) {
      return reason ? 'Ask about ' + m[1] + ' and the wedding plans.' : 'Say hi to ' + m[1] + ' for me.';
    }
    if ((m = t.match(/^(?:parents?|partner|husband|wife):\s*([A-Z][a-z]+)/i))) {
      return reason ? 'Check in with ' + m[1] + ' too.' : 'Say hi to ' + m[1] + ' for me.';
    }
    if ((m = t.match(/(?:restoring|building|renovating|working on)\s+(.+?)\.?$/i))) {
      return reason ? 'Ask how ' + m[1] + ' is coming along.' : 'How is ' + m[1] + ' coming along?';
    }
  }
  if (p.giftHistory.length) {
    const h = p.giftHistory.slice().sort((a, b) => b.year - a.year)[0];
    return reason ? 'Last gift was the ' + h.title.toLowerCase() + '. Ask if it is still in use.' : 'Still thinking about last year\u2019s ' + h.title.toLowerCase() + '.';
  }
  if (notes.length) return reason ? 'Ask about this: ' + notes[0].text + '.' : notes[0].text + '. Tell me more about that.';
  return reason ? 'It has been a while. Say hi.' : 'It has been too long.';

/* Template by relationship group, occasion kind and tone. The specific line stays the same across tones. */

  let opener, rest;

    const age = item.age;
    opener = 'Happy birthday, ' + who + '.';
    if (tone === 'funny') {

      const ageBit = age != null ? (age < 13 ? numberWord(age) + ' is a big one.' : age + ' suits you.') : 'I hope today is a good one.';
      rest = ageBit + ' ' + line + (formal ? ' Thank you for everything you taught me.' : family ? ' So glad you are mine.' : ' Grateful for another year of you.') + ' Talk soon.';
    }
  } else if (kind === 'anniversary') {
    const yrs = item.years != null ? item.years + ' years' : 'Another year';
    opener = 'Happy anniversary, ' + who + '.';
    if (tone === 'funny') rest = yrs + ' and you still like each other. Impressive. ' + line + ' Enjoy the night.';
    else if (tone === 'short') rest = yrs + '. ' + line;
    else rest = yrs + ' is something to be proud of. ' + line + ' Dinner is on me soon.';
  } else if (kind === 'holiday') {
    opener = 'Happy ' + item.title + ', ' + who + '.';
    if (tone === 'funny') rest = 'Save me a plate and at least one argument. ' + line + ' Calling you this afternoon.';
    else if (tone === 'short') rest = line;
    else rest = 'Grateful for you today and every day. ' + line + ' Calling you this afternoon.';
  } else if (kind === 'custom') {
    const t = item.title.toLowerCase();
    if (tone === 'funny') { opener = 'Big day, ' + who + '.'; rest = capital(t) + ' is here and I expect a full report. ' + line + ' Go show them.'; }
    else if (tone === 'short') { opener = 'Good luck today, ' + who + '.'; rest = line; }
    else { opener = 'Thinking of you today, ' + who + '.'; rest = capital(t) + ' is a big deal and you are ready for it. ' + line + ' Tell me everything after.'; }
  } else {
    if (tone === 'funny') { opener = who + '.'; rest = 'Checking you are still alive. ' + line + ' Prove it with a reply.'; }
    else if (tone === 'short') { opener = 'Hi ' + who + '.'; rest = line + ' Miss you.'; }
    else { opener = 'Hi ' + who + '.'; rest = 'You have been on my mind. ' + line + ' Free for a call this week?'; }
  }
  if (p.channel === 'card') {
    const me = (S.profile.name || '').trim();
    const open2 = kind === 'justbecause' ? '' : opener.replace(/, [^.]+\.$/, '.') + ' ';
    return 'Dear ' + who + ',\n\n' + open2 + rest + '\n\nWith love,\n' + (me || 'me');
  }
  return opener + ' ' + rest;
}
function numberWord(n){ const w = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve']; return w[n] || String(n); }
function capital(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }

/* ---------- rendering ---------- */
let rendering = false, renderQueued = false;
function render(){
  /* Replacing the view can blur a field, which fires change, which asks to render again. Never nest. */
  if (rendering) { renderQueued = true; return; }
  rendering = true;
  try {
    const activeId = document.activeElement && document.activeElement.id;
    renderCtx();
    renderNav();
    renderView();
    renderSheet();
    if (activeId) { const el = document.getElementById(activeId); if (el && el !== document.activeElement) { try { el.focus({ preventScroll: true }); } catch (e) {} } }
  } finally {
    rendering = false;
    if (renderQueued) { renderQueued = false; render(); }
  }
}
function renderCtx(){
  const c = $('#ctx');
  if (S.tab === 'settings') { c.innerHTML = ''; return; }
  c.innerHTML = '<button class="ctx" data-action="add-person" aria-label="Add a person">' + SVG_PLUS + '<span>Add</span></button>';
}
function renderNav(){

}
function renderView(){
  const v = $('#view');

  v.innerHTML = '<section class="view" aria-labelledby="view-title">' + fn() + '</section>';

/* Up next */
function groupLabel(item){
  const d = item.days, t = today();
  if (d === 0) return 'Today';
  if (d <= 7) return 'This week';
  if (d <= 14) return 'Next week';
  const m = item.date.getMonth();
  return (m === t.getMonth() && item.date.getFullYear() === t.getFullYear()) ? 'Later in ' + MONTHS[m] : 'In ' + MONTHS[m];
}
function itemHTML(item, missedItem){
  const chip = missedItem ? { cls:'chip-missed', text:'Missed' } : chipFor(item);
  return '<button class="item' + (item.days === 0 ? ' today' : '') + '" data-action="open-occasion" data-key="' + esc(item.key) + '" data-days="' + item.days + '" data-pid="' + esc(item.pid) + '">' +
    avatarsHTML(item.people) +

    '<span class="side"><span class="chip ' + chip.cls + '" data-chip>' + esc(chip.text) + '</span><span class="when">' + esc(daysText(item.days)) + '</span></span></button>';
}
function viewUpNext(){
  const items = upcoming(), late = missed();
  let html = '<h1 class="h1" id="view-title">Up next</h1><p class="sub">' + esc(fmtDay(today())) + '. ' + (items.length ? items.length + ' ' + plural(items.length, 'occasion') + ' in the next 60 days.' : 'Nothing in the next 60 days.') + '</p>';
  if (!items.length && !late.length) {

/* People */
function nextForPerson(p){
  const items = upcoming().filter(i => i.pid === p.id || (i.people && i.people.some(x => x.id === p.id)));
  if (items.length) { const i = items[0]; return occLabel(i).split(',')[0] + ' ' + daysText(i.days).toLowerCase(); }
  /* nothing inside 60 days: name the next yearly occasion anyway */
  const t = today(), cands = [];
  if (p.birthday) cands.push({ label: 'Birthday', date: nextOccurrence(p.birthday.month, p.birthday.day, addDays(t, 1)) });
  if (p.anniversary) cands.push({ label: 'Anniversary', date: nextOccurrence(p.anniversary.month, p.anniversary.day, addDays(t, 1)) });
  p.occasions.filter(o => o.repeats === 'yearly').forEach(o => cands.push({ label: o.title, date: nextOccurrence(o.month, o.day, addDays(t, 1)) }));
  if (!cands.length) return 'No occasions yet';
  cands.sort((a, b) => a.date - b.date);
  return cands[0].label + ' on ' + fmtDate(cands[0].date, false);
}
function viewPeople(){
  const list = S.people.slice().sort((a, b) => a.name.localeCompare(b.name));

    '<span class="s" style="display:block">' + esc(p.relationship) + '. ' + esc(nextForPerson(p)) + '</span></span></button></li>'

  return html;
}

/* Gifts */
function pickedGift(item){ const gid = S.picks[item.key]; if (!gid) return null; for (const p of item.people) { const g = p.gifts.find(x => x.id === gid); if (g) return { gift: g, person: p }; } return null; }
function statusChip(st){ const m = { idea:'Idea', bought:'Bought', given:'Given' }; return '<span class="chip chip-' + st + '">' + m[st] + '</span>'; }
function nextGiftAction(g){ return g.status === 'idea' ? 'Mark bought' : g.status === 'bought' ? 'Mark given' : ''; }
function priceBand(n){ n = Number(n) || 0; return n < 25 ? 'under' : n <= 75 ? 'mid' : 'over'; }
function viewGifts(){

        (pg ? '<span class="s plum" style="display:block;margin-top:4px">' + esc(pg.gift.title) + ' <span class="price">' + money(pg.gift.price) + '</span></span>' : '') + '</span>' +
        (pg ? '<span style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' + statusChip(pg.gift.status) + (nextGiftAction(pg.gift) ? '<button class="btn btn-secondary btn-sm" data-action="gift-advance" data-pid="' + esc(pg.person.id) + '" data-gid="' + esc(pg.gift.id) + '">' + nextGiftAction(pg.gift) + '</button>' : '') + '</span>'

/* Occasion sheet */
function sheetOccasion(sh){

/* ---------- vcf ---------- */
function parseVcfDate(v){
  v = String(v || '').trim();
  let m;
  if ((m = v.match(/^--(\d{2})-?(\d{2})/))) return { month: +m[1], day: +m[2], year: null };
  if ((m = v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return { year: +m[1] === 1604 ? null : +m[1], month: +m[2], day: +m[3] };
  if ((m = v.match(/^(\d{4})(\d{2})(\d{2})/))) return { year: +m[1] === 1604 ? null : +m[1], month: +m[2], day: +m[3] };
  return null;
}
function parseVcf(text){
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const un = [];
  lines.forEach(l => { if (/^[ \t]/.test(l) && un.length) un[un.length - 1] += l.slice(1); else un.push(l); });
  const cards = []; let cur = null;
  un.forEach(l => {
    const u = l.trim();
    if (/^BEGIN:VCARD/i.test(u)) { cur = { fn: '', n: '', bday: null, anniv: null, tel: '' }; return; }
    if (/^END:VCARD/i.test(u)) { if (cur) cards.push(cur); cur = null; return; }
    if (!cur) return;
    const idx = u.indexOf(':'); if (idx < 0) return;
    const left = u.slice(0, idx), val = u.slice(idx + 1);
    const name = left.split(';')[0].replace(/^item\d+\./i, '').toUpperCase();
    if (name === 'FN') cur.fn = val.trim();
    else if (name === 'N') { const parts = val.split(';'); cur.n = [parts[1], parts[0]].filter(Boolean).join(' ').trim(); }
    else if (name === 'BDAY') cur.bday = parseVcfDate(val);
    else if (name === 'X-ANNIVERSARY' || name === 'ANNIVERSARY') cur.anniv = parseVcfDate(val);
    else if (name === 'TEL' && !cur.tel) cur.tel = val.replace(/[^\d+]/g, '');
  });
  return cards.map(c => ({ name: c.fn || c.n, bday: c.bday, anniv: c.anniv, phone: c.tel, checked: true })).filter(c => c.name);
}
function addImported(rows){

/* ---------- ics ---------- */
function icsEscape(s){ return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line){ const out = []; let s = line; while (s.length > 73) { out.push(s.slice(0, 73)); s = ' ' + s.slice(73); } out.push(s); return out.join('\r\n'); }
function buildIcs(){
  const t = today();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lead = Number(S.leads.plan) || 0;
  const L = [];
  const ev = (uidPart, date, summary, desc, yearly) => {
    L.push('BEGIN:VEVENT', 'UID:' + uidPart + '@labs.keep', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + iso(date).replace(/-/g, ''));
    if (yearly) L.push('RRULE:FREQ=YEARLY');
    L.push('SUMMARY:' + icsEscape(summary), 'DESCRIPTION:' + icsEscape(desc), 'TRANSP:TRANSPARENT');
    L.push('BEGIN:VALARM', 'TRIGGER:-P' + lead + 'D', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape('Plan it. ' + summary), 'END:VALARM', 'END:VEVENT');
  };
  L.push('BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ellington Labs//Keep//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Keep');
  S.people.forEach(p => {
    if (p.birthday) ev('keep-' + p.id + '-bday', nextOccurrence(p.birthday.month, p.birthday.day, t), p.name + '\u2019s birthday', (p.birthday.year ? 'Born ' + p.birthday.year + '. ' : '') + 'From Keep.', true);
    if (p.anniversary) ev('keep-' + p.id + '-anniv', nextOccurrence(p.anniversary.month, p.anniversary.day, t), p.name + ' anniversary', (p.anniversary.year ? 'Since ' + p.anniversary.year + '. ' : '') + 'From Keep.', true);
    p.occasions.forEach(o => {
      const date = o.repeats === 'once' ? new Date(o.year, o.month - 1, o.day) : nextOccurrence(o.month, o.day, t);
      ev('keep-' + p.id + '-' + o.id, date, p.name + ': ' + o.title, 'From Keep.', o.repeats !== 'once');
    });
  });
  S.holidays.forEach(h => ev('keep-h-' + h.id, new Date(h.year, h.month - 1, h.day), h.title + (h.plan ? '. ' + h.plan : ''), 'From Keep.', false));
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function download(name, text, type){
  try {
    const blob = new Blob([text], { type: type || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch (e) { toast('Could not start the download'); }
}

function toast(msg){
  const t = $('#toasts'); t.innerHTML = '';
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; t.appendChild(el);
  setTimeout(() => { el.remove(); }, 2200);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- actions ---------- */
function markTalked(pid){ const p = byId(pid); if (!p) return; p.lastContact = iso(today()); save(); }
function advanceGift(pid, gid){
  const p = byId(pid); if (!p) return;
  const g = p.gifts.find(x => x.id === gid); if (!g) return;
  if (g.status === 'idea') { g.status = 'bought'; toast('Marked bought'); }
  else if (g.status === 'bought') {
    g.status = 'given';
    let year = today().getFullYear(), occasion = 'Gift';
    Object.keys(S.picks).forEach(k => { if (S.picks[k] === gid) { const parts = k.split(':'); year = Number(parts[2]) || year; occasion = parts[1] === 'bday' ? 'Birthday' : parts[1] === 'anniv' ? 'Anniversary' : (p.occasions.find(o => o.id === parts[1]) || {}).title || 'Gift'; } });
    p.giftHistory.push({ year, title: g.title, occasion });
    toast('Given. Added to history');
  }
  save();
}
const actions = {
  tab(el){ ui.scroll[S.tab] = $('#view').scrollTop; S.tab = el.dataset.tab; ui.resetArmed = false; save(); render(); },
  'add-person'(){ openSheet({ type: 'add-person' }); },
  'open-occasion'(el){ openSheet({ type: 'occasion', key: el.dataset.key, tone: 'warm', draftOpen: false, draftText: '' }); },
  'open-person'(el){ ui.sheets = []; openSheet({ type: 'person', pid: el.dataset.pid }); },
  'close-sheet'(){ closeSheet(); },
  'step-done'(el){ S.done[el.dataset.key] = true; delete S.snoozed[el.dataset.key]; save(); toast('Done'); render(); },
  'step-undo'(el){ delete S.done[el.dataset.key]; save(); render(); },
  'step-snooze'(el){ S.snoozed[el.dataset.key] = iso(addDays(today(), 1)); save(); toast('Snoozed until tomorrow'); render(); },
  'step-unsnooze'(el){ delete S.snoozed[el.dataset.key]; save(); render(); },
  'pick-gift'(el){ openSheet({ type: 'pick', key: el.dataset.key }); },
  'choose-gift'(el){ S.picks[el.dataset.key] = el.dataset.gid; save(); toast('Gift picked'); closeSheet(); },
  'gift-advance'(el){ advanceGift(el.dataset.pid, el.dataset.gid); render(); },
  'gift-remove'(el){ const p = byId(el.dataset.pid); if (!p) return; p.gifts = p.gifts.filter(g => g.id !== el.dataset.gid); Object.keys(S.picks).forEach(k => { if (S.picks[k] === el.dataset.gid) delete S.picks[k]; }); save(); toast('Removed'); render(); },
  'draft-open'(){ const sh = topSheet(); const item = itemByKey(sh.key); if (!item) return; sh.draftOpen = true; sh.draftText = draftMessage(item.person, item, sh.tone); render(); const ta = $('#draft-text'); if (ta) ta.scrollIntoView({ block: 'center' }); },
  tone(el){ const sh = topSheet(); sh.tone = el.dataset.tone; if (sh.type === 'occasion') { const item = itemByKey(sh.key); if (item) sh.draftText = draftMessage(item.person, item, sh.tone); } else if (sh.type === 'note') { sh.draftText = draftMessage(byId(sh.pid), null, sh.tone); } render(); },
  async 'copy-draft'(){ const ta = $('#draft-text'); const ok = await copyText(ta ? ta.value : (topSheet() || {}).draftText || ''); toast(ok ? 'Copied' : 'Select the text and copy it'); },
  'mark-sent'(el){
    const item = itemByKey(el.dataset.key); if (!item) return;
    STEPS.forEach(s => { const k = item.key + ':' + s.k; if (S.done[k] !== 'skipped') S.done[k] = true; });
    item.people.forEach(p => { p.lastContact = iso(today()); });
    save(); ui.sheets = []; toast('Sent. Last contact updated'); render();
  },
  'note-sent'(el){ markTalked(el.dataset.pid); ui.sheets = []; toast('Sent. Last contact updated'); render(); },
  talked(el){ markTalked(el.dataset.pid); toast('Last contact set to today'); render(); },
  'draft-note'(el){ const p = byId(el.dataset.pid); if (!p) return; openSheet({ type: 'note', pid: p.id, tone: 'warm', draftText: draftMessage(p, null, 'warm') }); },
  filter(el){ ui.giftFilter = el.dataset.filter; render(); },
  'remove-note'(el){ const p = byId(el.dataset.pid); if (!p) return; p.notes = p.notes.filter(n => n.id !== el.dataset.nid); save(); render(); },
  'occ-edit'(el){ topSheet().editOcc = el.dataset.occ; render(); },
  'occ-cancel'(){ topSheet().editOcc = null; render(); },
  'occ-remove'(el){
    const p = byId(el.dataset.pid); if (!p) return;
    const id = el.dataset.occ;
    if (id === 'bday') p.birthday = null; else if (id === 'anniv') p.anniversary = null; else p.occasions = p.occasions.filter(o => o.id !== id);
    save(); toast('Removed'); render();
  },
  'remove-person'(el){
    const pid = el.dataset.pid;
    if (ui.removeArmed !== pid) { ui.removeArmed = pid; render(); return; }
    S.people = S.people.filter(p => p.id !== pid);
    S.holidays.forEach(h => { h.personIds = h.personIds.filter(x => x !== pid); });
    ui.removeArmed = null; save(); ui.sheets = []; toast('Removed'); render();
  },
  'notify-on'(){
    if (!('Notification' in window)) return;
    try {
      Notification.requestPermission().then(p => { S.notify = p === 'granted'; save(); render(); toast(p === 'granted' ? 'Reminders on' : 'Reminders stay off'); if (p === 'granted') maybeNotify(); });
    } catch (e) { toast('This browser cannot ask'); }
  },
  'notify-off'(){ S.notify = false; save(); toast('Reminders off'); render(); },
  'export-ics'(){ download('keep.ics', buildIcs(), 'text/calendar'); toast('Calendar downloaded'); },
  'export-json'(){ download('keep-backup.json', JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded'); },
  'reset-seed'(){
    if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { if (ui.resetArmed) { ui.resetArmed = false; render(); } }, 4000); return; }
    const tab = S.tab; S = seed(); S.tab = tab; ui.resetArmed = false; ui.sheets = []; save(); toast('Seed restored'); render();
  },
  'import-add-all'(){ const sh = topSheet(); const n = addImported(sh.rows); ui.sheets = []; S.tab = 'people'; save(); toast('Added ' + n + ' ' + plural(n, 'person', 'people')); render(); },
  'import-add-selected'(){ const sh = topSheet(); const n = addImported(sh.rows.filter(r => r.checked)); ui.sheets = []; S.tab = 'people'; save(); toast('Added ' + n + ' ' + plural(n, 'person', 'people')); render(); }
};
const forms = {
  'add-person'(f){
    const d = new FormData(f);
    const name = String(d.get('name') || '').trim(); if (!name) return;
    const bday = String(d.get('birthday') || '');
    let birthday = null;
    if (bday) { const x = fromISO(bday); birthday = { month: x.getMonth() + 1, day: x.getDate(), year: d.get('knowYear') ? x.getFullYear() : null }; }
    const p = person({ name, relationship: d.get('relationship') || 'Friend', pronoun: d.get('pronoun') || 'they', color: COLOR_KEYS[S.people.length % COLOR_KEYS.length], birthday, channel: d.get('channel') || 'text', cadence: Number(d.get('cadence')) || 30, phone: String(d.get('phone') || '').replace(/[^\d+]/g, ''), lastContact: iso(today()) });
    S.people.push(p); skipPassedSteps(p.id); save(); ui.sheets = []; toast('Added ' + firstName(p)); render();
  },
  'person-details'(f){
    const p = byId(f.dataset.pid); if (!p) return;
    const d = new FormData(f);
    p.name = String(d.get('name') || p.name).trim() || p.name; p.relationship = d.get('relationship') || p.relationship; p.pronoun = d.get('pronoun') || p.pronoun; p.channel = d.get('channel') || p.channel; p.cadence = Number(d.get('cadence')) || p.cadence; p.phone = String(d.get('phone') || '').replace(/[^\d+]/g, ''); p.color = d.get('color') || p.color;
    save(); toast('Saved'); render();
  },
  'add-note'(f){ const p = byId(f.dataset.pid); if (!p) return; const text = String(new FormData(f).get('text') || '').trim(); if (!text) return; p.notes.push({ id: uid(), text, at: new Date().toISOString() }); save(); toast('Note added'); render(); },
  'add-gift'(f){ const p = byId(f.dataset.pid); if (!p) return; const d = new FormData(f); const title = String(d.get('title') || '').trim(); if (!title) return; p.gifts.push({ id: uid(), title, price: Number(d.get('price')) || 0, status: 'idea' }); save(); toast('Idea added'); render(); },
  'pick-add'(f){ const item = itemByKey(f.dataset.key); if (!item) return; const d = new FormData(f); const title = String(d.get('title') || '').trim(); if (!title) return; const g = { id: uid(), title, price: Number(d.get('price')) || 0, status: 'idea' }; item.person.gifts.push(g); S.picks[item.key] = g.id; save(); toast('Gift picked'); closeSheet(); },
  'add-occasion'(f){
    const p = byId(f.dataset.pid); if (!p) return;
    const d = new FormData(f); const date = String(d.get('date') || ''); if (!date) return;
    const x = fromISO(date); const type = d.get('type'); const knowYear = !!d.get('knowYear');
    if (type === 'birthday') p.birthday = { month: x.getMonth() + 1, day: x.getDate(), year: knowYear ? x.getFullYear() : null };
    else if (type === 'anniversary') p.anniversary = { month: x.getMonth() + 1, day: x.getDate(), year: knowYear ? x.getFullYear() : null };
    else { const title = String(d.get('title') || '').trim() || 'Special day'; p.occasions.push({ id: uid(), title, month: x.getMonth() + 1, day: x.getDate(), year: x.getFullYear(), repeats: d.get('repeats') === 'yearly' ? 'yearly' : 'once' }); }
    skipPassedSteps(p.id); save(); toast('Occasion added'); render();
  },
  'edit-occasion'(f){
    const p = byId(f.dataset.pid); if (!p) return;
    const d = new FormData(f); const date = String(d.get('date') || ''); if (!date) return;
    const x = fromISO(date); const id = f.dataset.occ;
    if (id === 'bday') p.birthday = { month: x.getMonth() + 1, day: x.getDate(), year: d.get('knowYear') ? x.getFullYear() : null };
    else if (id === 'anniv') p.anniversary = { month: x.getMonth() + 1, day: x.getDate(), year: d.get('knowYear') ? x.getFullYear() : null };
    else { const o = p.occasions.find(z => z.id === id); if (o) { o.title = String(d.get('title') || o.title).trim() || o.title; o.month = x.getMonth() + 1; o.day = x.getDate(); o.year = x.getFullYear(); o.repeats = d.get('repeats') === 'yearly' ? 'yearly' : 'once'; } }
    topSheet().editOcc = null; save(); toast('Saved'); render();
  }
};
function setLead(k, v){
  v = Math.max(0, Math.min(120, Math.round(Number(v) || 0)));
  const order = ['plan','get','write','send'];
  const i = order.indexOf(k);
  S.leads[k] = v;
  for (let j = i - 1; j >= 0; j--) S.leads[order[j]] = Math.max(S.leads[order[j]], v);
  for (let j = i + 1; j < order.length; j++) S.leads[order[j]] = Math.min(S.leads[order[j]], v);
}
const changes = {
  'profile-name'(el){ S.profile.name = el.value.trim(); save(); },
  lead(el){ const before = JSON.stringify(S.leads); setLead(el.dataset.lead, el.value); if (JSON.stringify(S.leads) === before) return; save(); toast('Ladder updated'); render(); },
  vcf(el){
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const rows = parseVcf(String(r.result || '')); openSheet({ type: 'import', rows }); };
    r.onerror = () => toast('Could not read that file');
    r.readAsText(f);
    el.value = '';
  },
  json(el){
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(String(r.result || ''));
        if (!parsed || !Array.isArray(parsed.people)) throw new Error('shape');
        S = normalize(parsed); save(); toast('Backup restored'); render();
      } catch (e) { toast('That file is not a Keep backup'); }
    };
    r.onerror = () => toast('Could not read that file');
    r.readAsText(f);
    el.value = '';
  },
  'import-check'(el){ const sh = topSheet(); if (sh && sh.rows) { sh.rows[Number(el.dataset.i)].checked = el.checked; render(); } }
};

/* ---------- wiring ---------- */
const shell = $('#shell');
shell.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el || !shell.contains(el)) return;
  if (el.tagName === 'A') return;
  const fn = actions[el.dataset.action];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
shell.addEventListener('submit', ev => {
  const f = ev.target.closest('[data-form]');
  if (!f) return;
  ev.preventDefault();
  const fn = forms[f.dataset.form];
  if (fn) fn(f);
});
shell.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (!el) return;
  const fn = changes[el.dataset.change];
  if (fn) fn(el);
});
shell.addEventListener('input', ev => {
  const el = ev.target.closest('[data-input]');
  if (!el) return;
  if (el.dataset.input === 'draft') { const sh = topSheet(); if (sh) sh.draftText = el.value; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheets.length) closeSheet(); });

load();
render();
maybeNotify();
/* Exposed for the playground test harness. */
window.Keep = { get state(){ return S; }, buildItems, ladderFor, draftMessage, parseVcf, buildIcs, fmtDate, seed };
</script>
